name: MoniBuddy Security & Compliance CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  pull-requests: write # Required to write and update sticky PR comments

jobs:
  typecheck-and-sast:
    name: 🛡️ TypeScript Compiler Check & SAST Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: 1. Run TypeScript Compiler Check across all files
        run: npx tsc --noEmit

      - name: 2. Run Semgrep SAST Vulnerability Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript p/owasp-top-10
          generateSarif: "1"

      - name: Upload SAST Sarif Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  security-engine-benchmarks:
    name: ⚡ Sub-10ms Security Engine & Attack Simulation
    runs-on: ubuntu-latest
    needs: typecheck-and-sast

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 3. Run Zero-Trust Scam Engine Attack Suite & Capture Log
        id: benchmark
        run: |
          mkdir -p output
          node --experimental-strip-types src/security/simulatedAttacks-v2.ts | tee output/benchmark.log

      - name: 4. Post or Update Automated Sticky Benchmark Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('output/benchmark.log', 'utf8');

            const headerMarker = '<!-- monibuddy-benchmark-report -->';
            const commentBody = `${headerMarker}
            ### ⚡ MoniBuddy Zero-Trust Security Engine - CI Benchmark Report

            **Automated Verification:** Sub-10ms Execution & Statutory Security Guards Verified.

            \`\`\`text
            ${logContent.trim()}
            \`\`\`

            *Report automatically posted by MoniBuddy Security CI Pipeline.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(headerMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log('Successfully updated existing benchmark comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
              console.log('Successfully created new benchmark comment.');
            }
